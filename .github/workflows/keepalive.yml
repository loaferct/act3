# Keeps the free Render instance awake by pinging it every 10 minutes.
# Override the URL with the repository variable APP_URL (Settings > Secrets and variables >
# Actions > Variables) if the app moves. /api/meta is used because it never calls the AI model,
# so these pings do not use the team's AMD Token Factory quota.
name: Keep demo awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the app
        env:
          APP_URL: ${{ vars.APP_URL || 'https://act3-3p0r.onrender.com' }}
        run: |
          # A sleeping free instance can take about a minute to wake up, so allow time and retry.
          curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 10 \
            "${APP_URL%/}/api/meta" -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n"
